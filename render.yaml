# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect repo → Render detects render.yaml, or create Web Service manually with Docker.

services:
  - type: web
    name: formvity-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8081
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: formvity-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: formvity-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: formvity-db
          property: password

databases:
  - name: formvity-db
    plan: free
    databaseName: formvity
    user: formvity
