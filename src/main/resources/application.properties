spring.application.name=formvity

# Database — on Render set DATABASE_URL (postgres://...) or SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/formvity}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.servlet.context-path=/api/v1
server.port=${PORT:8081}

# JWT — set JWT_SECRET on Render (min 32 chars for HS256)
jwt.secret=${JWT_SECRET:formvity-dev-secret-change-me-in-production-32chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma-separated frontend origins (GitHub Pages + local dev)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://utkarshpurbey.github.io}

