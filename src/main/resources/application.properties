spring.application.name=formvity

# Database URL is built in DatabaseConfig from DATABASE_URL or SPRING_DATASOURCE_URL (Render).
# Do not set spring.datasource.url here — an empty env var would override with a blank URL.

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.servlet.context-path=/api/v1
server.port=${PORT:8081}

# JWT — set JWT_SECRET on Render (min 32 chars for HS256)
jwt.secret=${JWT_SECRET:formvity-dev-secret-change-me-in-production-32chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma-separated client app origins (GitHub Pages + local dev)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

# Logging (SLF4J + Logback) — console + rolling file (see logback-spring.xml)
logging.file.name=${LOG_FILE:logs/formvity.log}
logging.level.root=${ROOT_LOG_LEVEL:INFO}
logging.level.com.example.uttuCodes.formvity=${APP_LOG_LEVEL:DEBUG}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
